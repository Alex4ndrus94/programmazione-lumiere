<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programmazione — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#141212;
    --ink-soft:#1c1a19;
    --ivory:#F5F0E6;
    --ivory-dim:#a8a29a;
    --line: rgba(245,240,230,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0c0b0a;
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    padding:20px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px;
    font-size:34px;
    margin:0 0 4px;
  }
  .sub{color:var(--ivory-dim);font-size:14px;margin-bottom:24px;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{
    background:var(--ink-soft);
    color:var(--ivory-dim);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:8px;
    font-family:'Inter';
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .tabs button.active{background:var(--ivory);color:var(--ink);border-color:var(--ivory);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---- Editor ---- */
  .room-editor{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .room-header{
    padding:12px 16px;
    font-family:'Bebas Neue';
    font-size:20px;
    letter-spacing:1px;
    color:#141212;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .screenings{padding:12px 16px;}
  .screening-row{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .screening-row:last-child{border-bottom:none;}
  .screening-row input{
    background:#0c0b0a;
    border:1px solid var(--line);
    color:var(--ivory);
    padding:9px 10px;
    border-radius:7px;
    font-family:'Inter';
    font-size:14px;
    width:100%;
  }
  .field-label{font-size:11px;color:var(--ivory-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;display:block;}
  .price-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .price-grid select{
    background:#0c0b0a;border:1px solid var(--line);color:var(--ivory);
    padding:9px 10px;border-radius:7px;font-family:'Inter';font-size:14px;width:100%;
  }
  .row-actions{display:flex;justify-content:flex-end;}
  .btn-remove{background:transparent;border:1px solid #a8453d;color:#e08078;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
  .btn-add{
    width:100%;margin-top:8px;padding:10px;border-radius:7px;border:1px dashed var(--line);
    background:transparent;color:var(--ivory-dim);font-size:13px;cursor:pointer;font-family:'Inter';font-weight:600;
  }

  /* ---- Preview toolbar ---- */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .btn-export{
    background:#E8622C;color:#fff;border:none;padding:10px 18px;
    border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';
  }
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ivory-dim);}
  .preview-wrap{display:flex;justify-content:center;background:#000;padding:24px;border-radius:12px;overflow:auto;}

  /* ===================== SHEET (shared) ===================== */
  .sheet{background:var(--ink);color:var(--ivory);position:relative;flex-shrink:0;}
  .sprockets-v{
    position:absolute;top:0;bottom:0;width:22px;
    background-image: radial-gradient(circle, #0c0b0a 6px, transparent 6.5px);
    background-size: 22px 34px;
    background-position: center;
  }
  .sprockets-v.left{left:0;}
  .sprockets-v.right{right:0;}
  .sprockets-h{
    position:absolute;left:0;right:0;height:22px;
    background-image: radial-gradient(circle, #0c0b0a 6px, transparent 6.5px);
    background-size: 34px 22px;
    background-position: center;
  }
  .sprockets-h.top{top:0;}
  .sprockets-h.bottom{bottom:0;}

  .room-band{
    font-family:'Bebas Neue';
    letter-spacing:2px;
    color:#141212;
    text-align:center;
  }
  .film-title{font-family:'Inter';font-weight:700;}
  .film-times{font-family:'IBM Plex Mono';font-weight:600;}
  .price-tag{font-family:'IBM Plex Mono';font-weight:500;}

  /* ---- A5 print sheet ---- */
  #sheet-print{
    width:559px;height:794px; /* A5 @ ~96dpi-ish for screen preview */
    overflow:hidden;
    position:relative;
  }
  #print-content{
    transform-origin:top left;
    padding:26px 22px;
    --s:1; /* fattore di scala automatico per far entrare tutto in una pagina */
  }
  #sheet-print .doc-header{display:flex;align-items:center;gap:calc(10px * var(--s));margin-bottom:calc(14px * var(--s));}
  #sheet-print .doc-header img{width:calc(34px * var(--s));height:auto;flex-shrink:0;}
  #sheet-print .doc-title{font-family:'Bebas Neue';font-size:calc(26px * var(--s));letter-spacing:1px;line-height:1;}
  #sheet-print .doc-sub{font-size:calc(11px * var(--s));color:#E8622C;font-weight:700;letter-spacing:0.5px;}

  #sheet-print .room-card{display:flex;border-radius:calc(9px * var(--s));overflow:hidden;margin-bottom:calc(8px * var(--s));}
  #sheet-print .card-sidebar{
    width:calc(46px * var(--s));flex-shrink:0;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(6px * var(--s)) 0;
  }
  #sheet-print .sidebar-label{font-family:'Inter';font-size:calc(7.5px * var(--s));letter-spacing:1px;font-weight:700;}
  #sheet-print .sidebar-number{font-family:'Bebas Neue';font-size:calc(24px * var(--s));line-height:1;}
  #sheet-print .card-body{flex:1;background:#fff;padding:calc(8px * var(--s)) calc(11px * var(--s));display:flex;flex-direction:column;gap:calc(4px * var(--s));min-width:0;}
  #sheet-print .card-room-name{font-family:'Bebas Neue';font-size:calc(16px * var(--s));letter-spacing:1px;line-height:1;}
  #sheet-print .card-film-line{display:flex;align-items:center;justify-content:space-between;gap:calc(6px * var(--s));}
  #sheet-print .card-film-title-group{display:flex;align-items:baseline;gap:calc(7px * var(--s));flex-wrap:wrap;min-width:0;}
  #sheet-print .card-film-title{font-family:'Inter';font-weight:700;font-size:calc(13px * var(--s));color:#141212;}
  #sheet-print .card-film-list{display:flex;flex-direction:column;gap:calc(4px * var(--s));flex:1;}
  #sheet-print .card-film-list.spaced{justify-content:space-between;}
  #sheet-print .card-pills{display:flex;gap:calc(4px * var(--s));flex-wrap:wrap;}
  #sheet-print .time-pill{color:#fff;font-family:'Inter';font-weight:700;font-size:calc(10.5px * var(--s));padding:calc(3px * var(--s)) calc(7px * var(--s));border-radius:calc(5px * var(--s));white-space:nowrap;}
  #sheet-print .card-price{
    width:calc(64px * var(--s));flex-shrink:0;padding:calc(6px * var(--s));
    display:flex;flex-direction:column;justify-content:center;gap:calc(4px * var(--s));
  }
  #sheet-print .card-price.card-price-multi{justify-content:space-between;}
  #sheet-print .price-label{font-family:'Inter';font-size:calc(7.5px * var(--s));font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.5px;}
  #sheet-print .price-value{font-family:'Inter';font-size:calc(11.5px * var(--s));font-weight:800;color:#141212;}
  #sheet-print .price-divider{border-top:1px dashed rgba(0,0,0,0.25);}
  #sheet-print .price-mini-row{display:flex;flex-direction:column;gap:calc(1px * var(--s));}
  #sheet-print .price-mini-row .pm-row{display:flex;gap:calc(4px * var(--s));justify-content:space-between;white-space:nowrap;}
  #sheet-print .price-mini-row .pm-label{font-family:'Inter';font-weight:700;font-size:calc(6.5px * var(--s));color:#777;text-transform:uppercase;}
  #sheet-print .price-mini-row .pm-value{font-family:'Inter';font-weight:800;font-size:calc(8px * var(--s));color:#141212;}
  /* Layout "sala con un solo film": titolo grande sopra, orari in evidenza sotto */
  #sheet-print .card-body-single .card-film-title-lg{font-family:'Inter';font-weight:800;font-size:calc(16px * var(--s));color:#141212;margin-bottom:calc(2px * var(--s));}
  #sheet-print .card-body-single .card-pills-lg{display:flex;gap:calc(5px * var(--s));flex-wrap:wrap;}
  #sheet-print .card-body-single .time-pill-lg{color:#fff;font-family:'Inter';font-weight:800;font-size:calc(13px * var(--s));padding:calc(4px * var(--s)) calc(9px * var(--s));border-radius:calc(6px * var(--s));white-space:nowrap;}

  /* ---- Mobile wallpaper ---- */
  #sheet-mobile{
    width:390px;height:846px; /* stesso rapporto ~2,169:1 del riferimento 2213×4798 */
    background:#000000;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 18px;
    overflow:hidden;
  }
  #sheet-mobile .mobile-safe-top{
    flex:0 0 38%; /* zona lasciata libera per orologio e widget della lock screen iPhone */
    width:100%;
  }
  #sheet-mobile .mobile-safe-bottom{
    flex:0 0 7%; /* zona lasciata libera per le icone torcia/fotocamera in basso */
    width:100%;
  }
  #sheet-mobile .mobile-content-group{
    flex:1;min-height:0;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  }
  #sheet-mobile .mobile-table-border{
    width:100%;border:3px solid #E8622C;border-radius:12px;overflow:hidden;
    padding:12px;box-sizing:border-box;background:var(--ink);
  }
  #mobile-content{ --s:1; }
  #sheet-mobile .doc-header{display:flex;align-items:center;justify-content:center;gap:calc(8px * var(--s));margin-bottom:calc(10px * var(--s));}
  #sheet-mobile .doc-header img{width:calc(24px * var(--s));height:auto;flex-shrink:0;}
  #sheet-mobile .doc-title{font-family:'Bebas Neue';font-size:calc(25px * var(--s));letter-spacing:1px;line-height:1;}
  #sheet-mobile .doc-sub{font-size:calc(10.5px * var(--s));color:#E8622C;font-weight:700;letter-spacing:0.5px;}

  #sheet-mobile .room-card{display:flex;border-radius:calc(9px * var(--s));overflow:hidden;margin-bottom:calc(8px * var(--s));}
  #sheet-mobile .card-sidebar{
    width:calc(40px * var(--s));flex-shrink:0;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(6px * var(--s)) 0;
  }
  #sheet-mobile .sidebar-label{font-family:'Inter';font-size:calc(8px * var(--s));letter-spacing:0.5px;font-weight:700;}
  #sheet-mobile .sidebar-number{font-family:'Bebas Neue';font-size:calc(23px * var(--s));line-height:1;}
  #sheet-mobile .card-body{flex:1;background:#fff;padding:calc(9px * var(--s)) calc(11px * var(--s));display:flex;flex-direction:column;gap:calc(4px * var(--s));min-width:0;}
  #sheet-mobile .card-room-name{font-family:'Bebas Neue';font-size:calc(17px * var(--s));letter-spacing:0.5px;line-height:1;}
  #sheet-mobile .card-film-line{display:flex;align-items:center;justify-content:space-between;gap:calc(4px * var(--s));}
  #sheet-mobile .card-film-title-group{display:flex;align-items:baseline;gap:calc(5px * var(--s));flex-wrap:wrap;min-width:0;}
  #sheet-mobile .card-film-title{font-family:'Inter';font-weight:700;font-size:calc(13.5px * var(--s));color:#141212;}
  #sheet-mobile .card-film-list{display:flex;flex-direction:column;gap:calc(3px * var(--s));flex:1;}
  #sheet-mobile .card-film-list.spaced{justify-content:space-between;}
  #sheet-mobile .card-pills{display:flex;gap:calc(3px * var(--s));flex-wrap:wrap;}
  #sheet-mobile .time-pill{color:#fff;font-family:'Inter';font-weight:700;font-size:calc(11.5px * var(--s));padding:calc(3px * var(--s)) calc(7px * var(--s));border-radius:calc(5px * var(--s));white-space:nowrap;}
  #sheet-mobile .card-price{
    width:calc(48px * var(--s));flex-shrink:0;padding:calc(4px * var(--s));
    display:flex;flex-direction:column;justify-content:center;gap:calc(3px * var(--s));
  }
  #sheet-mobile .card-price.card-price-multi{justify-content:space-between;}
  #sheet-mobile .price-label{font-family:'Inter';font-size:calc(6px * var(--s));font-weight:700;color:#666;text-transform:uppercase;}
  #sheet-mobile .price-value{font-family:'Inter';font-size:calc(8.5px * var(--s));font-weight:800;color:#141212;}
  #sheet-mobile .price-divider{border-top:1px dashed rgba(0,0,0,0.25);}
  #sheet-mobile .price-mini-row{display:flex;flex-direction:column;gap:calc(1px * var(--s));}
  #sheet-mobile .price-mini-row .pm-row{display:flex;gap:calc(3px * var(--s));justify-content:space-between;white-space:nowrap;}
  #sheet-mobile .price-mini-row .pm-label{font-family:'Inter';font-weight:700;font-size:calc(5px * var(--s));color:#777;text-transform:uppercase;}
  #sheet-mobile .price-mini-row .pm-value{font-family:'Inter';font-weight:800;font-size:calc(6px * var(--s));color:#141212;}
  /* Layout "sala con un solo film": titolo grande sopra, orari in evidenza sotto */
  #sheet-mobile .card-body-single .card-film-title-lg{font-family:'Inter';font-weight:800;font-size:calc(17px * var(--s));color:#141212;margin-bottom:calc(3px * var(--s));}
  #sheet-mobile .card-body-single .card-pills-lg{display:flex;gap:calc(4px * var(--s));flex-wrap:wrap;}
  #sheet-mobile .card-body-single .time-pill-lg{color:#fff;font-family:'Inter';font-weight:800;font-size:calc(13.5px * var(--s));padding:calc(4px * var(--s)) calc(9px * var(--s));border-radius:calc(6px * var(--s));white-space:nowrap;}

  #sheet-mobile .mobile-brand{
    display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;
  }
  #sheet-mobile .mobile-brand img{width:56px;height:auto;}
  #sheet-mobile .mobile-brand .brand-text{
    font-family:'Inter';font-weight:800;font-size:18px;letter-spacing:1px;color:#E8622C;
    text-transform:uppercase;text-align:center;
  }

  /* ---- Public banner: sfondo immagine reale + testo posizionato sopra ---- */
  /* Dimensioni e coordinate ricavate dal file banner-frame.png (1513x1039).
     Se in futuro cambi il file di sfondo con uno di dimensioni diverse,
     queste coordinate vanno rimisurate. */
  #sheet-banner{
    width:1513px;height:1039px;
    position:relative;
    background:#000;
    overflow:hidden;
  }
  #sheet-banner .frame-bg{
    position:absolute;top:0;left:0;width:1513px;height:1039px;display:block;z-index:0;
  }
  #sheet-banner .overlay-zone{
    position:absolute;overflow:hidden;box-sizing:border-box;z-index:1;
  }
  /* Zona 1: data (barra bianca sotto il logo LUMIÈRE) */
  #sheet-banner .zone-data{
    left:405px;top:247px;width:643px;height:52px;
    display:flex;align-items:center;justify-content:center;
  }
  #sheet-banner .zone-data span{
    font-family:'Inter';font-weight:900;font-size:44px;letter-spacing:1px;color:#141212;text-transform:uppercase;
  }
  /* Zona 2: tabella FILM/ORARI normale */
  #sheet-banner .zone-table{
    left:23px;top:360px;width:1015px;height:356px;
    padding:6px 14px;display:flex;flex-direction:column;justify-content:center;--zs:1;
  }
  /* Zona 3: sezione CineRevolution (qualunque film con "Sezione promo" compilata) */
  #sheet-banner .zone-cinerevolution{
    left:23px;top:753px;width:1015px;height:214px;
    padding:6px 14px;display:flex;flex-direction:column;justify-content:center;--zs:1;
  }
  /* Zona 4: box Prevendite */
  #sheet-banner .zone-prevendite{
    left:1062px;top:389px;width:426px;height:113px;
    padding:4px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;--zs:1;
  }
  #sheet-banner .zone-row{
    display:grid;grid-template-columns:58% 42%;align-items:start;column-gap:10px;
    padding:calc(6px * var(--zs)) 0;border-bottom:1px solid #eee;
  }
  #sheet-banner .zone-row:last-child{border-bottom:none;}
  #sheet-banner .zone-row .zf-title{
    font-family:'Inter';font-weight:800;font-size:calc(40px * var(--zs));color:#141212;text-transform:uppercase;line-height:1.15;
    overflow-wrap:break-word;text-align:center;
  }
  #sheet-banner .zone-row .zf-times{
    font-family:'Inter';font-weight:800;font-size:calc(40px * var(--zs));color:#a11e1e;text-align:center;line-height:1.15;
    overflow-wrap:break-word;display:block;
  }
  #sheet-banner .zone-row .zf-price{
    font-family:'IBM Plex Mono';font-weight:600;font-size:calc(18px * var(--zs));color:#777;display:block;text-align:center;
  }
  #sheet-banner .prevendite-row{
    display:flex;align-items:center;gap:14px;padding:calc(8px * var(--zs)) 0;
  }
  #sheet-banner .prevendite-badge{
    font-family:'Inter';font-weight:800;font-size:calc(26px * var(--zs));color:#fff;padding:5px 14px;
    border-radius:7px;text-transform:uppercase;flex-shrink:0;
  }
  #sheet-banner .prevendite-film{font-family:'Inter';font-weight:800;font-size:calc(36px * var(--zs));color:#141212;}
  #sheet-banner .prevendite-times{font-family:'Inter';font-weight:700;font-size:calc(30px * var(--zs));color:#a11e1e;margin-left:auto;}
</style>
</head>
<body>

<h1>Programmazione Cinema</h1>
<div class="sub">Inserisci una volta, esporta stampa A5 · sfondo mobile · banner pubblico</div>

<div class="tabs">
  <button class="active" data-tab="edit">Editor</button>
  <button data-tab="print">Anteprima stampa A5</button>
  <button data-tab="mobile">Anteprima sfondo mobile</button>
  <button data-tab="banner">Anteprima banner pubblico</button>
</div>

<!-- ================= EDITOR ================= -->
<div class="panel active" id="panel-edit">
  <div id="rooms-editor"></div>
</div>

<!-- ================= PRINT ================= -->
<div class="panel" id="panel-print">
  <div class="toolbar">
    <button class="btn-export" onclick="exportPDF()">Scarica PDF (Stampa A5)</button>
  </div>
  <div class="preview-wrap"><div id="sheet-print" class="sheet"></div></div>
</div>

<!-- ================= MOBILE ================= -->
<div class="panel" id="panel-mobile">
  <div class="toolbar">
    <button class="btn-export" onclick="exportPNG('sheet-mobile','sfondo-mobile')">Scarica PNG (Sfondo mobile)</button>
  </div>
  <div class="preview-wrap"><div id="sheet-mobile" class="sheet"></div></div>
</div>

<!-- ================= BANNER ================= -->
<div class="panel" id="panel-banner">
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="toggle-sala"> Mostra sala</label>
    <label class="toggle"><input type="checkbox" id="toggle-prezzo"> Mostra prezzi</label>
    <button class="btn-export" onclick="exportPDFBanner()">Scarica PDF (A4 orizzontale)</button>
    <button class="btn-export" onclick="exportPNG('sheet-banner','banner-pubblico-monitor')">Scarica PNG (per monitor)</button>
  </div>
  <div class="preview-wrap"><div id="sheet-banner" class="sheet"></div></div>
</div>

<script>
/* ============ DATA MODEL ============ */
const ROOMS = [
  {id:'decurtis',   name:'DE CURTIS',  color:'#5B6EF5'},
  {id:'sordi',      name:'SORDI',      color:'#43C89A'},
  {id:'bergman',    name:'BERGMAN',    color:'#C77DF2'},
  {id:'virnalisi',  name:'VIRNA LISI', color:'#4FD8D8'},
  {id:'desica',     name:'DE SICA',    color:'#F2C94C'},
  {id:'mastroianni',name:'MASTROIANNI',color:'#F4685A'},
];
// Sala "fantasma": non è una sala vera, è un contenitore per la prevendita.
// Compare in fondo alla stampa A5 e allo sfondo mobile SOLO se ha film dentro,
// e nel banner pubblico finisce sempre nel box speciale evidenziato invece che in tabella.
const PREVENDITA_ROOM = {id:'prevendita', name:'PREVENDITA', color:'#C0C0C8'};
const ROOMS_STAMPA = [...ROOMS, PREVENDITA_ROOM]; // ordine di stampa: le 6 sale + prevendita in fondo

const DEFAULT_DATA = {
  decurtis: [
    {film:'SpiderMan Brand New Day', times:'16:45 - 19:30 - 22:15', intero:'10,5', ridotto:'-', abb:'N'}
  ],
  sordi: [
    {film:'SpiderMan Brand New Day', times:'18:15 - 21:00', intero:'10,5', ridotto:'-', abb:'N'}
  ],
  bergman: [
    {film:'Odissea', times:'18:00 - 21:15', intero:'10,5', ridotto:'9,5', abb:'N'}
  ],
  virnalisi: [
    {film:'Odissea', times:'20:30', intero:'10,5', ridotto:'-', abb:'N'}
  ],
  desica: [
    {film:'Minions', times:'17:30', intero:'8,5', ridotto:'7,5', abb:'S'},
    {film:'Odissea', times:'19:15', intero:'9', ridotto:'-', abb:'N'},

function fitPrintContent(){
  const content = document.getElementById('print-content');
  if(!content) return;
  const sheet = document.getElementById('sheet-print');
  if(sheet.clientHeight === 0) return; // pannello non visibile, salta il calcolo
  content.style.setProperty('--s', 1);
  content.style.transform = 'none';
  let s = 1;
  for(let i=0; i<8; i++){
    const naturalHeight = content.scrollHeight;
    if(naturalHeight <= sheet.clientHeight) break;
    const ratio = sheet.clientHeight / naturalHeight;
    s = s * ratio * 0.97; // piccolo margine di sicurezza per convergere
    content.style.setProperty('--s', s);
  }
}

function fitMobileContent(){
  const sheet = document.getElementById('sheet-mobile');
  const group = document.querySelector('#sheet-mobile .mobile-content-group');
  const content = document.getElementById('mobile-content');
  const border = document.querySelector('#sheet-mobile .mobile-table-border');
  const brand = document.querySelector('#sheet-mobile .mobile-brand');
  if(!content || !border || !brand || !sheet || !group) return;
  if(sheet.clientHeight === 0) return; // pannello non visibile, salta

  // Spazio verticale disponibile per la tabella = altezza del gruppo sotto la zona orologio,
  // meno gap e bordo/padding del riquadro
  const groupStyle = getComputedStyle(group);
  const gap = parseFloat(groupStyle.rowGap || groupStyle.gap || 26);
  const borderExtra = 2 * (3 + 12); // border 3px + padding 12px, sopra e sotto
  const budget = group.clientHeight - gap - brand.offsetHeight - borderExtra;
  border.style.maxHeight = Math.max(80, budget) + 'px';

  content.style.setProperty('--s', 1);
  let s = 1;
  for(let i=0; i<8; i++){
    const naturalHeight = content.scrollHeight;
    const availableHeight = border.clientHeight;
    if(naturalHeight <= availableHeight) break;
    const ratio = availableHeight / naturalHeight;
    s = s * ratio * 0.97;
    content.style.setProperty('--s', s);
  }
}

// html2canvas non supporta bene color-mix() del CSS moderno: calcoliamo il colore chiaro a mano
function lightenColor(hex, whiteAmount){
  hex = hex.replace('#','');
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  const mix = c => Math.round(c + (255-c)*whiteAmount);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

function roomNumberFor(room){
  if(room.id === 'prevendita') return '★';
  const idx = ROOMS.findIndex(r=>r.id===room.id);
  return String(idx+1).padStart(2,'0');
}

function roomsBlocksHTML(showPrices, includePrevendita=true){
  const roomsList = includePrevendita ? ROOMS_STAMPA : ROOMS;
  return roomsList.map(room=>{
    const screenings = data[room.id] || [];
    if(screenings.length===0) return '';

    // Prezzo unico di sala solo se TUTTI i film hanno lo stesso prezzo; altrimenti un pannello con una riga per film
    const uniquePrices = new Set(screenings.map(s=>`${s.intero}|${s.ridotto}|${s.abb}`));
    const showSharedPrice = showPrices && uniquePrices.size === 1;
    const showPerFilmPrice = showPrices && !showSharedPrice;
    const isSingleFilm = screenings.length === 1;

    let filmLines;
    if(isSingleFilm){
      // Sala con un solo film: titolo grande sopra, orari in evidenza sotto (più leggibile)
      const s = screenings[0];
      const timesSet = new Set();
      s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>timesSet.add(t));
      const sortedTimes = sortTimesChronologically(timesSet);
      const pills = sortedTimes.map(t=>`<span class="time-pill-lg" style="background:${room.color}">${escHtml(t)}</span>`).join('');
      filmLines = `<div class="card-film-title-lg">${escHtml(s.film)}</div>
        <div class="card-pills-lg">${pills}</div>`;
    }else{
      filmLines = `<div class="card-film-list${showPerFilmPrice ? ' spaced' : ''}">` + screenings.map(s=>{
        const timesSet = new Set();
        s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>timesSet.add(t));
        const sortedTimes = sortTimesChronologically(timesSet);
        const pills = sortedTimes.map(t=>`<span class="time-pill" style="background:${room.color}">${escHtml(t)}</span>`).join('');
        return `<div class="card-film-line">
          <span class="card-film-title-group">
            <span class="card-film-title">${escHtml(s.film)}</span>
            <span class="card-pills">${pills}</span>
          </span>
        </div>`;
      }).join('') + `</div>`;
    }

    const first = screenings[0];
    let priceHTML = '';
    if(showSharedPrice){
      priceHTML = `
      <div class="card-price" style="background:${lightenColor(room.color, 0.85)};">
        <div><div class="price-label">Intero</div><div class="price-value">€ ${first.intero||'-'}</div></div>
        <div class="price-divider"></div>
        <div><div class="price-label">Ridotto</div><div class="price-value">${first.ridotto?'€ '+first.ridotto:'-'}</div></div>
        <div class="price-divider"></div>
        <div><div class="price-label">Abb.</div><div class="price-value">${first.abb||'N'}</div></div>
      </div>`;
    }else if(showPerFilmPrice){
      // Un unico pannello a tutta altezza come nelle sale a film singolo, ma con una riga di prezzo
      // per ciascun film, allineata alla riga del film corrispondente nel corpo della card.
      const rows = screenings.map(s=>`
        <div class="price-mini-row">
          <div class="pm-row"><span class="pm-label">Int.</span><span class="pm-value">€${s.intero||'-'}</span></div>
          <div class="pm-row"><span class="pm-label">Rid.</span><span class="pm-value">${s.ridotto?'€'+s.ridotto:'-'}</span></div>
          <div class="pm-row"><span class="pm-label">Abb.</span><span class="pm-value">${s.abb||'N'}</span></div>
        </div>`).join('');
      priceHTML = `<div class="card-price card-price-multi" style="background:${lightenColor(room.color, 0.85)};">${rows}</div>`;
    }

    return `<div class="room-card">
      <div class="card-sidebar" style="background:${room.color}">
        <div class="sidebar-label">SALA</div>
        <div class="sidebar-number">${roomNumberFor(room)}</div>
      </div>
      <div class="card-body${isSingleFilm ? ' card-body-single' : ''}">
        <div class="card-room-name" style="color:${room.color}">${room.name}</div>
        ${filmLines}
      </div>
      ${priceHTML}
    </div>`;
  }).join('');
}

function renderBannerSheet(){
  const showSala = document.getElementById('toggle-sala').checked;
  const showPrezzo = document.getElementById('toggle-prezzo').checked;
  const el = document.getElementById('sheet-banner');

  // Raggruppa per film+versione+sezionePromo, unendo gli orari da tutte le sale (dedup automatico dei "doppioni" da overflow interno)
  let filmMap = new Map();
  ROOMS.forEach(room=>{
    (data[room.id]||[]).forEach(s=>{
      if(!s.film) return;
      const sezione = (s.sezionePromo||'').trim();
      const key = (s.film.trim().toLowerCase())+'|'+((s.versione||'').trim().toLowerCase())+'|'+sezione.toLowerCase();
      if(!filmMap.has(key)){
        filmMap.set(key, {film:s.film.trim(), versione:(s.versione||'').trim(), sezionePromo:sezione, times:new Set(), rooms:new Set()});
      }
      const entry = filmMap.get(key);
      entry.rooms.add(room.name);
      s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>entry.times.add(t));
    });
  });
  let entries = Array.from(filmMap.values());
  const normali = entries.filter(e=>!e.sezionePromo);
  // Qualunque testo nella sezione promo finisce comunque nella zona "CineRevolution" già disegnata nell'immagine
  const cinerevolution = entries.filter(e=>e.sezionePromo);

  function rowHTML(entry){
    const sortedTimes = sortTimesChronologically(entry.times).join(' - ');
    const versionTag = entry.versione ? ` (${escHtml(entry.versione)})` : '';
    const salaTag = showSala ? ' — ' + Array.from(entry.rooms).join(', ') : '';
    const priceInline = showPrezzo ? `<span class="zf-price">${pricesForFilm(entry)}</span>` : '';
    return `<div class="zone-row">
      <span class="zf-title">${escHtml(entry.film)}${versionTag}${salaTag}</span>
      <span class="zf-times">${escHtml(sortedTimes)}${priceInline}</span>
    </div>`;
  }

  const tableRowsHTML = normali.map(rowHTML).join('');
  const cinerevolutionRowsHTML = cinerevolution.map(rowHTML).join('');

  // ---- Box PREVENDITE: dalla sala fantasma "prevendita", raggruppata per film ----
  const badgeColors = ['#2E7D32','#1B3A6B','#8B2E2E','#6A3E9E','#B5651D'];
  let prevenditeHTML = '';
  const prevenditaScreenings = (data['prevendita']||[]).filter(s=>s.film);
  if(prevenditaScreenings.length){
    const byFilm = new Map();
    prevenditaScreenings.forEach(s=>{
      if(!byFilm.has(s.film)) byFilm.set(s.film, []);
      byFilm.get(s.film).push(s);
    });
    prevenditeHTML = Array.from(byFilm.entries()).map(([film, list])=>{
      const badgeRows = list.map((s,i)=>{
        const label = s.versione ? s.versione.toUpperCase() : 'STANDARD';
        const color = badgeColors[i % badgeColors.length];
        const times = new Set();
        s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>times.add(t));
        const sortedTimes = sortTimesChronologically(times).join(' - ');
        return `<div class="prevendite-row">
          <span class="prevendite-badge" style="background:${color}">${escHtml(label)}</span>
          <span class="prevendite-film">${escHtml(film)}</span>
          <span class="prevendite-times">${escHtml(sortedTimes)}</span>
        </div>`;
      }).join('');
      return badgeRows;
    }).join('');
  }

  el.innerHTML = `
    <img src="banner-frame.png" alt="Cinema Multisala Lumière" class="frame-bg" onerror="this.style.opacity='0';">
    <div class="overlay-zone zone-data"><span>${bannerHeadline()}</span></div>
    <div class="overlay-zone zone-table" id="zone-table">${tableRowsHTML}</div>
    <div class="overlay-zone zone-cinerevolution" id="zone-cinerevolution">${cinerevolutionRowsHTML}</div>
    <div class="overlay-zone zone-prevendite" id="zone-prevendite">${prevenditeHTML}</div>
  `;

  fitZone('zone-table');
  fitZone('zone-cinerevolution');
  fitZone('zone-prevendite');
}

function bannerHeadline(){
  const d = new Date();
  const giorni = ['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];
  return 'DA ' + giorni[d.getDay()];
}

// Rimpicciolisce il contenuto di una zona overlay se non ci sta nello spazio fisso disegnato nell'immagine.
// Non ingrandisce mai (le zone dell'immagine hanno una dimensione fissa e nota).
function fitZone(id){
  const zone = document.getElementById(id);
  if(!zone) return;
  if(zone.clientHeight === 0) return; // pannello non visibile, salta
  zone.style.setProperty('--zs', 1);
  let s = 1;
  for(let i=0; i<10; i++){
    const naturalH = zone.scrollHeight;
    const availH = zone.clientHeight;
    const naturalW = zone.scrollWidth;
    const availW = zone.clientWidth;
    const hRatio = availH / naturalH;
    const wRatio = availW / naturalW; // <1 se orari con tante fasce orarie escono dal bordo in larghezza
    const ratio = Math.min(hRatio, wRatio, 1);
    if(ratio >= 0.97) break;
    s = Math.max(0.35, s * ratio * 0.97);
    zone.style.setProperty('--zs', s);
  }
}



function sortTimesChronologically(timesSet){
  return Array.from(timesSet).sort((a,b)=>{
    const toMinutes = t=>{
      const m = t.match(/(\d{1,2})[:.](\d{2})/);
      if(!m) return 0;
      return parseInt(m[1],10)*60 + parseInt(m[2],10);
    };
    return toMinutes(a) - toMinutes(b);
  });
}

function roomColorByName(name){
  const r = ROOMS.find(r=>r.name===name);
  return r ? r.color : '#888';
}

function pricesForFilm(entry){
  // Recupera intero/ridotto da tutte le proiezioni di quel film+versione, e se coincidono mostra un solo valore
  const interi = new Set(), ridotti = new Set();
  ROOMS.forEach(room=>{
    (data[room.id]||[]).forEach(s=>{
      if(!s.film) return;
      const key = (s.film.trim().toLowerCase())+'|'+((s.versione||'').trim().toLowerCase());
      const entryKey = (entry.film.trim().toLowerCase())+'|'+(entry.versione.trim().toLowerCase());
      if(key===entryKey){
        if(s.intero) interi.add(s.intero.trim());
        if(s.ridotto) ridotti.add(s.ridotto.trim());
      }
    });
  });
  const interoStr = interi.size ? Array.from(interi).join('/') : '-';
  const ridottoStr = ridotti.size ? Array.from(ridotti).join('/') : '-';
  return `Intero ${interoStr} · Ridotto ${ridottoStr}`;
}

function escHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function exportPNG(elId, filename){
  // Apriamo subito la scheda, nello stesso istante del tap: iOS Safari blocca
  // le aperture "in differita" dopo un'operazione asincrona come html2canvas.
  const win = window.open('', '_blank');
  try{
    if(elId==='sheet-banner'){ fitZone('zone-table'); fitZone('zone-cinerevolution'); fitZone('zone-prevendite'); }
    if(elId==='sheet-mobile'){ fitMobileContent(); }
    const node = document.getElementById(elId);
    const bg = elId==='sheet-banner' ? '#FFFFFF' : '#141212';
    // Per lo sfondo mobile puntiamo alla risoluzione esatta richiesta (2213×4798px)
    // invece di un fattore di scala fisso, così il file combacia sempre con quella misura.
    const scale = elId==='sheet-mobile' ? (2213 / node.offsetWidth) : 3;
    const canvas = await html2canvas(node, {backgroundColor:bg, scale});
    // Usiamo un Blob invece di un data-URL: un PNG in alta qualità genera un
    // URL troppo lungo che Safari su iOS a volte rifiuta di aprire in silenzio.
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(win && blob){
      const blobUrl = URL.createObjectURL(blob);
      win.location.href = blobUrl;
    }else if(win){
      win.close();
      alert('Errore nella generazione dell\'immagine. Riprova.');
    }else{
      alert('Il browser ha bloccato l\'apertura automatica. Consenti i popup per questo sito nelle impostazioni di Safari e riprova.');
    }
  }catch(err){
    if(win) win.close();
    alert('Errore durante la generazione: ' + err.message);
    console.error(err);
  }
}

async function exportPDF(){
  const win = window.open('', '_blank');
  try{
    fitPrintContent();
    const node = document.getElementById('sheet-print');
    const canvas = await html2canvas(node, {backgroundColor:'#141212', scale:3});
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a5', orientation:'portrait'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    pdf.addImage(imgData, 'PNG', 0, 0, pageW, pageH);
    const blobUrl = pdf.output('bloburl');
    if(win){
      win.location.href = blobUrl;
    }else{
      alert('Il browser ha bloccato l\'apertura automatica. Consenti i popup per questo sito nelle impostazioni di Safari e riprova.');
    }
  }catch(err){
    if(win) win.close();
    alert('Errore durante la generazione: ' + err.message);
    console.error(err);
  }
}

async function exportPDFBanner(){
  const win = window.open('', '_blank');
  const frameImg = document.querySelector('#sheet-banner .frame-bg');
  const originalSrc = frameImg ? frameImg.getAttribute('src') : null;
  try{
    fitZone('zone-table'); fitZone('zone-cinerevolution'); fitZone('zone-prevendite');
    const node = document.getElementById('sheet-banner');

    // Per il PDF (stampa) usiamo la cornice in bianco e nero; il PNG (monitor) resta a colori.
    if(frameImg){

        frameImg.onerror = reject;

      });
    }

    const canvas = await html2canvas(node, {backgroundColor:'#FFFFFF', scale:3});
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    // La cornice ha un rapporto (1513:1039) leggermente diverso dall'A4 standard:
    // usiamo una pagina larga come un A4 orizzontale ma alta il giusto per non deformare l'immagine.
    const ratio = 1513/1039;
    const pageW = 297;
    const pageH = pageW / ratio;
    const pdf = new jsPDF({unit:'mm', format:[pageW, pageH], orientation:'landscape'});
    pdf.addImage(imgData, 'PNG', 0, 0, pageW, pageH);
    const blobUrl = pdf.output('bloburl');
    if(win){
      win.location.href = blobUrl;
    }else{
      alert('Il browser ha bloccato l\'apertura automatica. Consenti i popup per questo sito nelle impostazioni di Safari e riprova.');
    }
  }catch(err){
    if(win) win.close();
    alert('Errore durante la generazione: ' + err.message);
    console.error(err);
  }finally{
    // Ripristiniamo sempre la cornice a colori nell'anteprima, qualunque cosa succeda
    if(frameImg && originalSrc){ frameImg.src = originalSrc; }
  }
}

renderAll();
</script>
</body>
</html>
