<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programmazione — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#141212;
    --ink-soft:#1c1a19;
    --ivory:#F5F0E6;
    --ivory-dim:#a8a29a;
    --line: rgba(245,240,230,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0c0b0a;
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    padding:20px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px;
    font-size:34px;
    margin:0 0 4px;
  }
  .sub{color:var(--ivory-dim);font-size:14px;margin-bottom:24px;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{
    background:var(--ink-soft);
    color:var(--ivory-dim);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:8px;
    font-family:'Inter';
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .tabs button.active{background:var(--ivory);color:var(--ink);border-color:var(--ivory);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---- Editor ---- */
  .room-editor{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .room-header{
    padding:12px 16px;
    font-family:'Bebas Neue';
    font-size:20px;
    letter-spacing:1px;
    color:#141212;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .screenings{padding:12px 16px;}
  .screening-row{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .screening-row:last-child{border-bottom:none;}
  .screening-row input{
    background:#0c0b0a;
    border:1px solid var(--line);
    color:var(--ivory);
    padding:9px 10px;
    border-radius:7px;
    font-family:'Inter';
    font-size:14px;
    width:100%;
  }
  .field-label{font-size:11px;color:var(--ivory-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;display:block;}
  .price-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .price-grid select{
    background:#0c0b0a;border:1px solid var(--line);color:var(--ivory);
    padding:9px 10px;border-radius:7px;font-family:'Inter';font-size:14px;width:100%;
  }
  .row-actions{display:flex;justify-content:flex-end;}
  .btn-remove{background:transparent;border:1px solid #a8453d;color:#e08078;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
  .btn-add{
    width:100%;margin-top:8px;padding:10px;border-radius:7px;border:1px dashed var(--line);
    background:transparent;color:var(--ivory-dim);font-size:13px;cursor:pointer;font-family:'Inter';font-weight:600;
  }

  /* ---- Preview toolbar ---- */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .btn-export{
    background:var(--ivory);color:var(--ink);border:none;padding:10px 18px;
    border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';
  }
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ivory-dim);}
  .preview-wrap{display:flex;justify-content:center;background:#000;padding:24px;border-radius:12px;overflow:auto;}

  /* ===================== SHEET (shared) ===================== */
  .sheet{background:var(--ink);color:var(--ivory);position:relative;}
  .sprockets-v{
    position:absolute;top:0;bottom:0;width:22px;
    background-image: radial-gradient(circle, #0c0b0a 6px, transparent 6.5px);
    background-size: 22px 34px;
    background-position: center;
  }
  .sprockets-v.left{left:0;}
  .sprockets-v.right{right:0;}
  .sprockets-h{
    position:absolute;left:0;right:0;height:22px;
    background-image: radial-gradient(circle, #0c0b0a 6px, transparent 6.5px);
    background-size: 34px 22px;
    background-position: center;
  }
  .sprockets-h.top{top:0;}
  .sprockets-h.bottom{bottom:0;}

  .room-band{
    font-family:'Bebas Neue';
    letter-spacing:2px;
    color:#141212;
    text-align:center;
  }
  .film-title{font-family:'Inter';font-weight:700;}
  .film-times{font-family:'IBM Plex Mono';font-weight:600;}
  .price-tag{font-family:'IBM Plex Mono';font-weight:500;}

  /* ---- A5 print sheet ---- */
  #sheet-print{
    width:559px;height:794px; /* A5 @ ~96dpi-ish for screen preview */
    overflow:hidden;
    position:relative;
  }
  #print-content{
    transform-origin:top left;
    padding:34px 30px 30px 46px;
    --s:1; /* fattore di scala automatico per far entrare tutto in una pagina */
  }
  #sheet-print .room-band{font-size:calc(19px * var(--s));padding:calc(8px * var(--s)) 0;border-radius:6px;margin-bottom:calc(8px * var(--s));}
  #sheet-print .film-row{display:flex;justify-content:space-between;align-items:baseline;padding:calc(5px * var(--s)) 0;}
  #sheet-print .film-title{font-size:calc(15px * var(--s));}
  #sheet-print .film-times{font-size:calc(15px * var(--s));}
  #sheet-print .prices{display:flex;gap:10px;font-size:calc(11px * var(--s));color:var(--ivory-dim);margin-bottom:calc(14px * var(--s));}
  #sheet-print .room-block{margin-bottom:calc(16px * var(--s));}
  #sheet-print .doc-title{font-family:'Bebas Neue';font-size:calc(26px * var(--s));letter-spacing:1px;margin-bottom:2px;}
  #sheet-print .doc-sub{font-size:calc(11px * var(--s));color:var(--ivory-dim);margin-bottom:calc(18px * var(--s));}

  /* ---- Mobile wallpaper ---- */
  #sheet-mobile{
    width:390px;height:846px; /* stesso rapporto ~2,169:1 del riferimento 2213×4798 */
    background:#000000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    padding:22px 18px;
    overflow:hidden;
  }
  #sheet-mobile .mobile-table-border{
    width:100%;border:3px solid #E8622C;border-radius:12px;overflow:hidden;
    padding:12px;box-sizing:border-box;
  }
  #mobile-content{ --s:1; }
  /* stessa identica logica della stampa A5, solo con basi più piccole per il canvas più stretto */
  #sheet-mobile .doc-title{font-family:'Bebas Neue';font-size:calc(19px * var(--s));letter-spacing:1px;margin-bottom:2px;text-align:center;}
  #sheet-mobile .doc-sub{font-size:calc(8px * var(--s));color:var(--ivory-dim);margin-bottom:calc(12px * var(--s));text-align:center;}
  #sheet-mobile .room-band{font-size:calc(13px * var(--s));padding:calc(6px * var(--s)) 0;border-radius:5px;margin-bottom:calc(6px * var(--s));}
  #sheet-mobile .film-row{display:flex;justify-content:space-between;align-items:baseline;padding:calc(4px * var(--s)) 0;}
  #sheet-mobile .film-title{font-size:calc(11px * var(--s));}
  #sheet-mobile .film-times{font-size:calc(11px * var(--s));}
  #sheet-mobile .prices{display:flex;gap:8px;font-size:calc(7.5px * var(--s));color:var(--ivory-dim);margin-bottom:calc(9px * var(--s));}
  #sheet-mobile .room-block{margin-bottom:calc(11px * var(--s));}

  #sheet-mobile .mobile-brand{
    display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;
  }
  #sheet-mobile .mobile-brand img{width:56px;height:auto;}
  #sheet-mobile .mobile-brand .brand-text{
    font-family:'Inter';font-weight:800;font-size:18px;letter-spacing:1px;color:#E8622C;
    text-transform:uppercase;text-align:center;
  }

  /* ---- Public banner (A4 orizzontale, stampa + monitor) — stile insegna Lumière ---- */
  #sheet-banner{
    width:1123px;height:794px; /* A4 landscape @ ~96dpi — dimensione bloccata, non deve mai cambiare */
    padding:30px 40px 22px;
    display:flex;
    flex-direction:column;
    background:#FFFFFF;
    color:#141212;
    position:relative;
    overflow:hidden; /* fondamentale: senza questo, il contenuto che trabocca viene comunque catturato nell'export, deformando il formato */
    box-sizing:border-box;
  }
  #sheet-banner .badge-cinema-img{
    position:absolute;top:16px;right:30px;width:112px;height:auto;
  }
  #sheet-banner .projector-img{
    position:absolute;top:6px;left:20px;width:140px;height:auto;
  }
  #sheet-banner .popcorn-chair-img{
    position:absolute;top:108px;right:14px;width:158px;height:auto;
  }
  #sheet-banner .banner-header{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:6px;
    padding:0 175px; /* riserva lo spazio delle illustrazioni ai lati, evita sovrapposizioni col titolo */
  }
  #sheet-banner .banner-header .stars{font-size:13px;letter-spacing:4px;color:#141212;white-space:nowrap;flex-shrink:0;}
  #sheet-banner .banner-title{
    font-family:'Inter';font-weight:900;font-size:27px;letter-spacing:0.5px;text-transform:uppercase;text-align:center;
    line-height:1.15;
  }
  #sheet-banner .banner-date-badge{
    background:#141212;color:#fff;
    font-family:'Inter';font-weight:800;font-size:17px;letter-spacing:1px;text-transform:uppercase;
    padding:8px 34px 8px 26px;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
    margin:6px auto 16px;
    display:table;
  }
  #sheet-banner .banner-body{
    flex:1;display:flex;gap:26px;min-height:0;
  }

  /* ---- tabella film ---- */
  #sheet-banner .banner-table{
    flex:1.7;border:2px solid #141212;border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  #sheet-banner .table-header{display:flex;background:#141212;color:#fff;flex-shrink:0;}
  #sheet-banner .table-header .col-film{flex:1.7;padding:9px 20px;font-family:'Inter';font-weight:800;font-size:16px;text-transform:uppercase;border-right:2px solid #fff;}
  #sheet-banner .table-header .col-orari{flex:1;padding:9px 20px;font-family:'Inter';font-weight:800;font-size:16px;text-transform:uppercase;text-align:center;}
  #sheet-banner .table-body{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;--bs:1;}
  #sheet-banner .table-row{display:flex;align-items:center;border-bottom:1px solid #ddd;}
  #sheet-banner .table-row:last-child{border-bottom:none;}
  #sheet-banner .table-row .col-film{
    flex:1.7;padding:calc(9px * var(--bs)) 20px;display:flex;align-items:center;gap:calc(10px * var(--bs));
    font-family:'Inter';font-weight:800;font-size:calc(16px * var(--bs));text-transform:uppercase;line-height:1.15;
  }
  #sheet-banner .reel-icon{
    width:calc(20px * var(--bs));height:calc(20px * var(--bs));border-radius:50%;flex-shrink:0;
    border:calc(3px * var(--bs)) solid #141212;
    background:radial-gradient(circle, #141212 24%, transparent 25%) center/55% 55% no-repeat;
  }
  #sheet-banner .table-row .col-orari{
    flex:1;padding:calc(9px * var(--bs)) 16px;text-align:center;border-left:2px solid #141212;
    font-family:'Inter';font-weight:800;font-size:calc(16px * var(--bs));line-height:1.2;
  }
  #sheet-banner .promo-section-bar{
    background:#141212;color:#fff;text-align:center;
    font-family:'Inter';font-weight:800;font-size:calc(13px * var(--bs));letter-spacing:1px;text-transform:uppercase;
    padding:calc(5px * var(--bs)) 0;
  }

  /* ---- colonna laterale destra (prevendita + info promo) ---- */
  #sheet-banner .banner-side{
    flex:1;display:flex;flex-direction:column;gap:calc(14px * var(--ss));min-width:0;
    min-height:0;overflow:hidden;--ss:1;
  }
  #sheet-banner .prevendita-box{
    border:2px solid #141212;border-radius:14px;overflow:hidden;flex-shrink:0;
  }
  #sheet-banner .prevendita-header{
    background:#F2C94C;color:#141212;font-family:'Inter';font-weight:800;font-size:calc(16px * var(--ss));
    text-transform:uppercase;padding:calc(8px * var(--ss)) 16px;display:flex;align-items:center;gap:10px;
  }
  #sheet-banner .prevendita-row{
    display:flex;align-items:center;gap:10px;padding:calc(8px * var(--ss)) 16px;border-top:1px solid #ddd;
  }
  #sheet-banner .prevendita-badge{
    font-family:'Inter';font-weight:800;font-size:11px;color:#fff;padding:3px 10px;
    border-radius:6px;text-transform:uppercase;flex-shrink:0;
  }
  #sheet-banner .prevendita-times{font-family:'Inter';font-weight:800;font-size:calc(14px * var(--ss));}

  /* ---- pannello info promo bar ---- */
  #sheet-banner .banner-info{
    flex:1;border:2px solid #141212;border-radius:14px;min-height:0;overflow:hidden;
    padding:calc(22px * var(--ss)) 20px;display:flex;flex-direction:column;justify-content:center;gap:calc(18px * var(--ss));
  }
  #sheet-banner .info-row{display:flex;align-items:flex-start;gap:13px;}
  #sheet-banner .info-icon{
    width:calc(38px * var(--ss));height:calc(38px * var(--ss));border-radius:50%;background:#141212;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:900;font-size:calc(16px * var(--ss));
  }
  #sheet-banner .info-icon.pin{position:relative;background:transparent;}
  #sheet-banner .info-icon.pin .pin-shape{
    width:calc(26px * var(--ss));height:calc(26px * var(--ss));background:#141212;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  }
  #sheet-banner .info-text{font-family:'Inter';font-size:calc(13px * var(--ss));line-height:1.42;font-weight:600;}
  #sheet-banner .info-text strong{font-weight:900;}
  #sheet-banner .info-divider{border-top:1px dashed #999;margin:0 4px;}

  #sheet-banner .banner-footer{
    display:flex;align-items:center;gap:18px;
    border-top:3px solid #141212;margin-top:16px;padding-top:14px;
  }
  #sheet-banner .footer-web{font-family:'Inter';font-size:13px;flex:1;text-align:center;}
  #sheet-banner .footer-web strong{font-weight:800;font-size:16px;letter-spacing:0.5px;}
  #sheet-banner .footer-divider{width:2px;align-self:stretch;background:#141212;}
  #sheet-banner .footer-logo{
    display:flex;align-items:center;gap:10px;
  }
  #sheet-banner .footer-logo img{height:46px;width:auto;display:block;}
  #sheet-banner .footer-logo-text{
    font-family:'Inter';font-weight:800;font-size:14px;letter-spacing:1px;text-align:right;line-height:1.3;
  }
  #sheet-banner .footer-logo-text span{font-weight:500;font-size:10px;letter-spacing:2px;color:#555;}


</style>
</head>
<body>

<h1>Programmazione Cinema</h1>
<div class="sub">Inserisci una volta, esporta stampa A5 · sfondo mobile · banner pubblico</div>

<div class="tabs">
  <button class="active" data-tab="edit">Editor</button>
  <button data-tab="print">Anteprima stampa A5</button>
  <button data-tab="mobile">Anteprima sfondo mobile</button>
  <button data-tab="banner">Anteprima banner pubblico</button>
</div>

<!-- ================= EDITOR ================= -->
<div class="panel active" id="panel-edit">
  <div id="rooms-editor"></div>
</div>

<!-- ================= PRINT ================= -->
<div class="panel" id="panel-print">
  <div class="toolbar">
    <button class="btn-export" onclick="exportPDF()">Scarica PDF (Stampa A5)</button>
  </div>
  <div class="preview-wrap"><div id="sheet-print" class="sheet"></div></div>
</div>

<!-- ================= MOBILE ================= -->
<div class="panel" id="panel-mobile">
  <div class="toolbar">
    <button class="btn-export" onclick="exportPNG('sheet-mobile','sfondo-mobile')">Scarica PNG (Sfondo mobile)</button>
  </div>
  <div class="preview-wrap"><div id="sheet-mobile" class="sheet"></div></div>
</div>

<!-- ================= BANNER ================= -->
<div class="panel" id="panel-banner">
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="toggle-sala"> Mostra sala</label>
    <label class="toggle"><input type="checkbox" id="toggle-prezzo"> Mostra prezzi</label>
    <label class="toggle"><input type="checkbox" id="toggle-promo" checked> Mostra promo BAR</label>
    <button class="btn-export" onclick="exportPDFBanner()">Scarica PDF (A4 orizzontale)</button>
    <button class="btn-export" onclick="exportPNG('sheet-banner','banner-pubblico-monitor')">Scarica PNG (per monitor)</button>
  </div>
  <div class="preview-wrap"><div id="sheet-banner" class="sheet"></div></div>
</div>

<script>
/* ============ DATA MODEL ============ */
const ROOMS = [
  {id:'decurtis',   name:'DE CURTIS',  color:'#5B6EF5'},
  {id:'sordi',      name:'SORDI',      color:'#43C89A'},
  {id:'bergman',    name:'BERGMAN',    color:'#C77DF2'},
  {id:'virnalisi',  name:'VIRNA LISI', color:'#4FD8D8'},
  {id:'desica',     name:'DE SICA',    color:'#F2C94C'},
  {id:'mastroianni',name:'MASTROIANNI',color:'#F4685A'},
];
// Sala "fantasma": non è una sala vera, è un contenitore per la prevendita.
// Compare in fondo alla stampa A5 e allo sfondo mobile SOLO se ha film dentro,
// e nel banner pubblico finisce sempre nel box speciale evidenziato invece che in tabella.
const PREVENDITA_ROOM = {id:'prevendita', name:'PREVENDITA', color:'#F2C94C'};
const ROOMS_STAMPA = [...ROOMS, PREVENDITA_ROOM]; // ordine di stampa: le 6 sale + prevendita in fondo

const DEFAULT_DATA = {
  decurtis: [
    {film:'SpiderMan Brand New Day', times:'16:45 - 19:30 - 22:15', intero:'10,5', ridotto:'-', abb:'N'}
  ],
  sordi: [
    {film:'SpiderMan Brand New Day', times:'18:15 - 21:00', intero:'10,5', ridotto:'-', abb:'N'}
  ],
  bergman: [
    {film:'Odissea', times:'18:00 - 21:15', intero:'10,5', ridotto:'9,5', abb:'N'}
  ],
  virnalisi: [
    {film:'Odissea', times:'20:30', intero:'10,5', ridotto:'-', abb:'N'}
  ],
  desica: [
    {film:'Minions', times:'17:30', intero:'8,5', ridotto:'7,5', abb:'S'},
    {film:'Odissea', times:'19:15', intero:'9', ridotto:'-', abb:'N'},
    {film:'Deep Water', times:'22:15', intero:'3,5', ridotto:'', abb:'N'},
  ],
  mastroianni: [
    {film:'Toy Story', times:'17:30', intero:'8.5', ridotto:'7.5', abb:'S'},
    {film:'Odissea', times:'19:15', intero:'9', ridotto:'', abb:'N'},
    {film:'Deep Water', times:'22:15', intero:'3,5', ridotto:'', abb:'N'},
  ],
  prevendita: [], // vuota di default: non compare finché non la riempi
};

let data = loadData();

function loadData(){
  const saved = localStorage.getItem('programmazione-data');
  if(saved){ try{ return JSON.parse(saved); }catch(e){} }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(){
  localStorage.setItem('programmazione-data', JSON.stringify(data));
}

/* ============ TABS ============ */
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    renderAll();
    if(btn.dataset.tab==='print'){ requestAnimationFrame(fitPrintContent); }
    if(btn.dataset.tab==='mobile'){ requestAnimationFrame(fitMobileContent); }
    if(btn.dataset.tab==='banner'){ requestAnimationFrame(fitBannerTable); requestAnimationFrame(fitBannerSide); }
  });
});

/* ============ EDITOR RENDER ============ */
function renderEditor(){
  const wrap = document.getElementById('rooms-editor');
  wrap.innerHTML = '';
  ROOMS_STAMPA.forEach(room=>{
    const box = document.createElement('div');
    box.className = 'room-editor';
    const header = document.createElement('div');
    header.className = 'room-band room-header';
    header.style.background = room.color;
    header.textContent = room.name;
    box.appendChild(header);

    if(room.id === 'prevendita'){
      const note = document.createElement('div');
      note.style.cssText = 'padding:8px 16px;font-size:12px;color:var(--ivory-dim);border-bottom:1px dashed var(--line);';
      note.textContent = 'Non è una sala vera: usala per i film in prevendita. Compare solo se la riempi — in fondo alla stampa A5 e allo sfondo mobile, e nel box speciale evidenziato del banner pubblico (non nella tabella).';
      box.appendChild(note);
    }

    const list = document.createElement('div');
    list.className = 'screenings';
    (data[room.id] || []).forEach((s, idx)=>{
      list.appendChild(screeningRow(room.id, s, idx));
    });
    box.appendChild(list);

    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add';
    addBtn.textContent = '+ Aggiungi film';
    addBtn.onclick = ()=>{
      data[room.id] = data[room.id] || [];
      data[room.id].push({film:'', times:'', intero:'', ridotto:'', abb:'N'});
      saveData(); renderEditor();
    };
    box.appendChild(addBtn);
    wrap.appendChild(box);
  });
}

function screeningRow(roomId, s, idx){
  const row = document.createElement('div');
  row.className = 'screening-row';
  row.innerHTML = `
    <div>
      <span class="field-label">Film</span>
      <input type="text" value="${escAttr(s.film)}" data-field="film">
    </div>
    <div>
      <span class="field-label">Orari (es. 17:30 - 20:00)</span>
      <input type="text" value="${escAttr(s.times)}" data-field="times">
    </div>
    <div>
      <span class="field-label">Versione (facoltativo — es. OV, 3D. Lascia vuoto se è solo copertura interna in un'altra sala)</span>
      <input type="text" value="${escAttr(s.versione||'')}" data-field="versione" placeholder="es. OV, 3D">
    </div>
    <div>
      <span class="field-label">Sezione promo (facoltativo — es. CineRevolution, Cinema in Festa. Se compilato, nel banner pubblico il film comparirà raggruppato sotto quell'etichetta SENZA mostrare il prezzo)</span>
      <input type="text" value="${escAttr(s.sezionePromo||'')}" data-field="sezionePromo" placeholder="es. CineRevolution">
    </div>
    <div class="price-grid">
      <div><span class="field-label">Intero</span><input type="text" value="${escAttr(s.intero)}" data-field="intero"></div>
      <div><span class="field-label">Ridotto</span><input type="text" value="${escAttr(s.ridotto)}" data-field="ridotto"></div>
      <div><span class="field-label">Abb.</span>
        <select data-field="abb">
          <option value="N" ${s.abb==='N'?'selected':''}>N</option>
          <option value="S" ${s.abb==='S'?'selected':''}>S</option>
        </select>
      </div>
    </div>
    <div class="row-actions"><button class="btn-remove">Rimuovi</button></div>
  `;
  row.querySelectorAll('input,select').forEach(el=>{
    el.addEventListener('input', ()=>{
      data[roomId][idx][el.dataset.field] = el.value;
      saveData();
    });
  });
  row.querySelector('.btn-remove').addEventListener('click', ()=>{
    data[roomId].splice(idx,1);
    saveData(); renderEditor();
  });
  return row;
}

function escAttr(str){ return (str||'').replace(/"/g,'&quot;'); }

/* ============ PRINT SHEET RENDER ============ */
function renderPrintSheet(){
  const el = document.getElementById('sheet-print');
  el.innerHTML = `<div class="sprockets-v left"></div>
    <div id="print-content">
      <div class="doc-title">PROGRAMMAZIONE</div>
      <div class="doc-sub">Aggiornata al ${todayStr()}</div>
      <div>${roomsBlocksHTML(true)}</div>
    </div>`;
  fitPrintContent();
}

function fitPrintContent(){
  const content = document.getElementById('print-content');
  if(!content) return;
  const sheet = document.getElementById('sheet-print');
  if(sheet.clientHeight === 0) return; // pannello non visibile, salta il calcolo
  content.style.setProperty('--s', 1);
  content.style.transform = 'none';
  let s = 1;
  for(let i=0; i<8; i++){
    const naturalHeight = content.scrollHeight;
    if(naturalHeight <= sheet.clientHeight) break;
    const ratio = sheet.clientHeight / naturalHeight;
    s = s * ratio * 0.97; // piccolo margine di sicurezza per convergere
    content.style.setProperty('--s', s);
  }
}

function renderMobileSheet(){
  const el = document.getElementById('sheet-mobile');
  el.innerHTML = `
    <div class="mobile-table-border">
      <div id="mobile-content">
        <div class="doc-title">PROGRAMMAZIONE</div>
        <div class="doc-sub">Aggiornata al ${todayStr()}</div>
        <div>${roomsBlocksHTML(false)}</div>
      </div>
    </div>
    <div class="mobile-brand">
      <img src="logo-lumiere.png" alt="Logo Cinema Lumière" onerror="this.style.display='none';">
      <div class="brand-text">Multisala Lumière</div>
    </div>`;
  fitMobileContent();
}

function fitMobileContent(){
  const sheet = document.getElementById('sheet-mobile');
  const content = document.getElementById('mobile-content');
  const border = document.querySelector('#sheet-mobile .mobile-table-border');
  const brand = document.querySelector('#sheet-mobile .mobile-brand');
  if(!content || !border || !brand || !sheet) return;
  if(sheet.clientHeight === 0) return; // pannello non visibile, salta

  // Spazio verticale disponibile per la tabella = altezza canvas - padding - gap - branding - bordo/padding del riquadro
  const sheetStyle = getComputedStyle(sheet);
  const padV = parseFloat(sheetStyle.paddingTop) + parseFloat(sheetStyle.paddingBottom);
  const gap = parseFloat(sheetStyle.rowGap || sheetStyle.gap || 26);
  const borderExtra = 2 * (3 + 12); // border 3px + padding 12px, sopra e sotto
  const budget = sheet.clientHeight - padV - gap - brand.offsetHeight - borderExtra;
  border.style.maxHeight = Math.max(80, budget) + 'px';

  content.style.setProperty('--s', 1);
  let s = 1;
  for(let i=0; i<8; i++){
    const naturalHeight = content.scrollHeight;
    const availableHeight = border.clientHeight;
    if(naturalHeight <= availableHeight) break;
    const ratio = availableHeight / naturalHeight;
    s = s * ratio * 0.97;
    content.style.setProperty('--s', s);
  }
}

function roomsBlocksHTML(showPrices){
  return ROOMS_STAMPA.map(room=>{
    const screenings = data[room.id] || [];
    if(screenings.length===0) return '';
    const rows = screenings.map(s=>{
      const timesSet = new Set();
      s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>timesSet.add(t));
      const sortedTimes = sortTimesChronologically(timesSet).join(' - ');
      const priceLine = showPrices ? `<div class="prices"><span>Intero ${s.intero||'-'}</span><span>Ridotto ${s.ridotto||'-'}</span><span>Abb. ${s.abb||'N'}</span></div>` : '';
      return `<div class="film-row"><span class="film-title">${escHtml(s.film)}</span><span class="film-times">${escHtml(sortedTimes)}</span></div>${priceLine}`;
    }).join('');
    return `<div class="room-block">
      <div class="room-band" style="background:${room.color}">${room.name}</div>
      ${rows}
    </div>`;
  }).join('');
}

/* ============ BANNER RENDER ============ */
function renderBannerSheet(){
  const showSala = document.getElementById('toggle-sala').checked;
  const showPrezzo = document.getElementById('toggle-prezzo').checked;
  const showPromo = document.getElementById('toggle-promo').checked;
  const el = document.getElementById('sheet-banner');

  let filmMap = new Map(); // key: film|versione|sezionePromo -> {film, versione, sezionePromo, times:Set, rooms:Set}
  ROOMS.forEach(room=>{
    (data[room.id]||[]).forEach(s=>{
      if(!s.film) return;
      const sezione = (s.sezionePromo||'').trim();
      const key = (s.film.trim().toLowerCase())+'|'+((s.versione||'').trim().toLowerCase())+'|'+sezione.toLowerCase();
      if(!filmMap.has(key)){
        filmMap.set(key, {film:s.film.trim(), versione:(s.versione||'').trim(), sezionePromo:sezione, times:new Set(), rooms:new Set()});
      }
      const entry = filmMap.get(key);
      entry.rooms.add(room.name);
      // uno "times" può contenere più orari separati da " - " (es. "16:45 - 19:30 - 22:15")
      s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>entry.times.add(t));
    });
  });

  let entries = Array.from(filmMap.values());
  const normali = entries.filter(e=>!e.sezionePromo);
  const promoSections = new Map(); // sezione -> [entries]
  entries.filter(e=>e.sezionePromo).forEach(e=>{
    if(!promoSections.has(e.sezionePromo)) promoSections.set(e.sezionePromo, []);
    promoSections.get(e.sezionePromo).push(e);
  });

  function rowHTML(entry){
    const sortedTimes = sortTimesChronologically(entry.times).join(' - ');
    const versionTag = entry.versione ? ` (${escHtml(entry.versione)})` : '';
    const salaTag = showSala ? ' — ' + Array.from(entry.rooms).join(', ') : '';
    // nelle sezioni promo il prezzo non si mostra mai, per definizione
    const priceInline = (showPrezzo && !entry.sezionePromo) ? `<div style="font-family:'IBM Plex Mono';font-weight:600;font-size:11px;color:#777;margin-top:2px;">${pricesForFilm(entry)}</div>` : '';
    return `<div class="table-row">
      <div class="col-film"><span class="reel-icon"></span>${escHtml(entry.film)}${versionTag}${salaTag}</div>
      <div class="col-orari">${escHtml(sortedTimes)}${priceInline}</div>
    </div>`;
  }

  let tableRowsHTML = normali.map(rowHTML).join('');
  promoSections.forEach((list, sezione)=>{
    tableRowsHTML += `<div class="promo-section-bar">★ ${escHtml(sezione.toUpperCase())} ★</div>` + list.map(rowHTML).join('');
  });

  // ---- Box PREVENDITA: tutto ciò che è nella sala fantasma "prevendita", raggruppato per film ----
  const badgeColors = ['#2E7D32','#1B3A6B','#8B2E2E','#6A3E9E','#B5651D'];
  let prevenditaHTML = '';
  const prevenditaScreenings = (data['prevendita']||[]).filter(s=>s.film);
  if(prevenditaScreenings.length){
    const byFilm = new Map();
    prevenditaScreenings.forEach(s=>{
      if(!byFilm.has(s.film)) byFilm.set(s.film, []);
      byFilm.get(s.film).push(s);
    });
    prevenditaHTML = Array.from(byFilm.entries()).map(([film, list])=>{
      const rows = list.map((s,i)=>{
        const label = s.versione ? s.versione.toUpperCase() : 'STANDARD';
        const color = badgeColors[i % badgeColors.length];
        const times = new Set();
        s.times.split('-').map(t=>t.trim()).filter(Boolean).forEach(t=>times.add(t));
        const sortedTimes = sortTimesChronologically(times).join(' - ');
        return `<div class="prevendita-row">
          <span class="prevendita-badge" style="background:${color}">${escHtml(label)}</span>
          <span class="prevendita-times">${escHtml(sortedTimes)}</span>
        </div>`;
      }).join('');
      return `<div class="prevendita-box">
        <div class="prevendita-header"><span class="reel-icon" style="border-color:#141212;"></span>${escHtml(film)}</div>
        ${rows}
      </div>`;
    }).join('');
  }

  const promoHTML = showPromo ? `<div class="banner-info">
    <div class="info-row">
      <div class="info-icon">€</div>
      <div class="info-text">Ogni <strong>4€</strong> spesi al nostro Ritrovo prima di fare il Biglietto equivalgono a <strong>1€</strong> di sconto sul costo del Biglietto.</div>
    </div>
    <div class="info-divider"></div>
    <div class="info-row">
      <div class="info-icon">✓</div>
      <div class="info-text">Conserva lo <strong>scontrino</strong> e presentalo alle casse cinema.</div>
    </div>
    <div class="info-divider"></div>
    <div class="info-row">
      <div class="info-icon pin"><span class="pin-shape"></span></div>
      <div class="info-text">Ci trovi a <strong>sinistra</strong> dopo l'ingresso del Cinema Multisala Lumière.</div>
    </div>
  </div>` : `<div class="banner-info"></div>`;

  el.innerHTML = `
    <img src="projector.png" alt="Proiettore" class="projector-img" onerror="this.style.display='none';">
    <img src="badge-cinema.png" alt="Il cinema ti aspetta" class="badge-cinema-img" onerror="this.style.display='none';">
    <img src="popcorn-chair.png" alt="Popcorn e sedia regista" class="popcorn-chair-img" onerror="this.style.display='none';">
    <div class="banner-header">
      <span class="stars">★</span>
      <span class="banner-title">Cinema Multisala Lumière</span>
      <span class="stars">★</span>
    </div>
    <div class="banner-date-badge">${bannerHeadline()}</div>
    <div class="banner-body">
      <div class="banner-table">
        <div class="table-header">
          <div class="col-film">Film</div>
          <div class="col-orari">Orari</div>
        </div>
        <div class="table-body" id="banner-table-body">${tableRowsHTML}</div>
      </div>
      <div class="banner-side" id="banner-side">
        ${prevenditaHTML}
        ${promoHTML}
      </div>
    </div>
    <div class="banner-footer">
      <div class="footer-web">★ Tutta la programmazione su <strong>www.cinemamultisalalumiere.it</strong> ★</div>
      <div class="footer-divider"></div>
      <div class="footer-logo">
        <img src="logo-lumiere.png" alt="Logo Cinema Lumière"
             onerror="this.style.display='none'; document.getElementById('footer-logo-fallback').style.display='block';">
        <div class="footer-logo-text" id="footer-logo-fallback" style="display:none;">CINEMA<br>LUMIÈRE<br><span>MULTISALA</span></div>
      </div>
    </div>`;

  fitBannerTable();
  fitBannerSide();
}

function bannerHeadline(){
  const d = new Date();
  const giorni = ['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return 'DA ' + giorni[d.getDay()] + ' ' + dd + '/' + mm;
}

function fitBannerTable(){
  const body = document.getElementById('banner-table-body');
  if(!body) return;
  if(body.clientHeight === 0) return; // pannello non visibile, salta
  body.style.setProperty('--bs', 1);
  let s = 1;
  for(let i=0; i<10; i++){
    const naturalH = body.scrollHeight;
    const availH = body.clientHeight;
    const naturalW = body.scrollWidth;
    const availW = body.clientWidth;
    const hRatio = availH / naturalH;
    const wRatio = availW / naturalW; // <1 se il testo trabocca in larghezza (es. orari lunghi)
    const ratio = Math.min(hRatio, wRatio); // la dimensione più stretta comanda
    if(Math.abs(ratio - 1) < 0.03) break;
    s = Math.max(0.65, Math.min(1.35, s * ratio * 0.97));
    body.style.setProperty('--bs', s);
  }
}

function fitBannerSide(){
  const side = document.getElementById('banner-side');
  if(!side) return;
  if(side.clientHeight === 0) return; // pannello non visibile, salta
  side.style.setProperty('--ss', 1);
  let s = 1;
  for(let i=0; i<10; i++){
    const naturalH = side.scrollHeight;
    const availH = side.clientHeight;
    if(naturalH <= availH) break; // qui vogliamo solo evitare il traboccamento, non riempire lo spazio a tutti i costi
    const ratio = availH / naturalH;
    s = Math.max(0.55, s * ratio * 0.97);
    side.style.setProperty('--ss', s);
  }
}


function sortTimesChronologically(timesSet){
  return Array.from(timesSet).sort((a,b)=>{
    const toMinutes = t=>{
      const m = t.match(/(\d{1,2})[:.](\d{2})/);
      if(!m) return 0;
      return parseInt(m[1],10)*60 + parseInt(m[2],10);
    };
    return toMinutes(a) - toMinutes(b);
  });
}

function roomColorByName(name){
  const r = ROOMS.find(r=>r.name===name);
  return r ? r.color : '#888';
}

function pricesForFilm(entry){
  // Recupera intero/ridotto da tutte le proiezioni di quel film+versione, e se coincidono mostra un solo valore
  const interi = new Set(), ridotti = new Set();
  ROOMS.forEach(room=>{
    (data[room.id]||[]).forEach(s=>{
      if(!s.film) return;
      const key = (s.film.trim().toLowerCase())+'|'+((s.versione||'').trim().toLowerCase());
      const entryKey = (entry.film.trim().toLowerCase())+'|'+(entry.versione.trim().toLowerCase());
      if(key===entryKey){
        if(s.intero) interi.add(s.intero.trim());
        if(s.ridotto) ridotti.add(s.ridotto.trim());
      }
    });
  });
  const interoStr = interi.size ? Array.from(interi).join('/') : '-';
  const ridottoStr = ridotti.size ? Array.from(ridotti).join('/') : '-';
  return `Intero ${interoStr} · Ridotto ${ridottoStr}`;
}

function escHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('it-IT');
}

function renderAll(){
  renderEditor();
  renderPrintSheet();
  renderMobileSheet();
  renderBannerSheet();
}

document.getElementById('toggle-sala').addEventListener('change', renderBannerSheet);
document.getElementById('toggle-prezzo').addEventListener('change', renderBannerSheet);
document.getElementById('toggle-promo').addEventListener('change', renderBannerSheet);

/* ============ EXPORT ============ */
async function exportPNG(elId, filename){
  // Apriamo subito la scheda, nello stesso istante del tap: iOS Safari blocca
  // le aperture "in differita" dopo un'operazione asincrona come html2canvas.
  const win = window.open('', '_blank');
  if(elId==='sheet-banner'){ fitBannerTable(); fitBannerSide(); }
  if(elId==='sheet-mobile'){ fitMobileContent(); }
  const node = document.getElementById(elId);
  const bg = elId==='sheet-banner' ? '#FFFFFF' : '#141212';
  // Per lo sfondo mobile puntiamo alla risoluzione esatta richiesta (2213×4798px)
  // invece di un fattore di scala fisso, così il file combacia sempre con quella misura.
  const scale = elId==='sheet-mobile' ? (2213 / node.offsetWidth) : 3;
  const canvas = await html2canvas(node, {backgroundColor:bg, scale});
  // Usiamo un Blob invece di un data-URL: un PNG in alta qualità genera un
  // URL troppo lungo che Safari su iOS a volte rifiuta di aprire in silenzio.
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if(win && blob){
    const blobUrl = URL.createObjectURL(blob);
    win.location.href = blobUrl;
  }else if(win){
    win.close();
    alert('Errore nella generazione dell\'immagine. Riprova.');
  }else{
    alert('Il browser ha bloccato l\'apertura automatica. Consenti i popup per questo sito nelle impostazioni di Safari e riprova.');
  }
}

async function exportPDF(){
  const win = window.open('', '_blank');
  fitPrintContent();
  const node = document.getElementById('sheet-print');
  const canvas = await html2canvas(node, {backgroundColor:'#141212', scale:3});
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a5', orientation:'portrait'});
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  pdf.addImage(imgData, 'PNG', 0, 0, pageW, pageH);
  const blobUrl = pdf.output('bloburl');
  if(win){
    win.location.href = blobUrl;
  }else{
    alert('Il browser ha bloccato l\'apertura automatica. Consenti i popup per questo sito nelle impostazioni di Safari e riprova.');
  }
}
